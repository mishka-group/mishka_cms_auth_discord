name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same branch or pull request makes the run in progress pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No job writes to the repository, so the token can only read it.
permissions:
  contents: read

env:
  # setup-beam installs Hex from builds.hex.pm, and one slow response there failed a whole run
  # ("Could not mix hex from any hex.pm mirror"). It tries these in order.
  HEXPM_MIRRORS: |
    https://builds.hex.pm
    https://cdn.jsdelivr.net/hex

jobs:
  # Compiled once; the jobs below start from this build.
  #
  # A cache entry can never be changed once saved, so the key carries the commit: each run saves the
  # build it made, and the next one starts from the nearest one before it (`restore-keys`) and
  # compiles only what changed.
  build:
    runs-on: ubuntu-latest

    steps:
      # Only this repository. mishka_cms_core and mishka_gervaz come from Hex, and mix.exs would use
      # a ../mishka_cms_core or ../mishka_gervaz checkout over Hex if it found one, so no sibling is
      # ever checked out here.
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
          hexpm-mirrors: ${{ env.HEXPM_MIRRORS }}

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-tool-versions-${{ hashFiles('.tool-versions') }}-mix-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-tool-versions-${{ hashFiles('.tool-versions') }}-mix-${{ hashFiles('mix.lock') }}-

      - run: mix deps.get

      - run: mix compile --warnings-as-errors
        env:
          MIX_ENV: test

  # Beside the tests rather than in front of them.
  format:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
          hexpm-mirrors: ${{ env.HEXPM_MIRRORS }}

      - uses: actions/cache/restore@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-tool-versions-${{ hashFiles('.tool-versions') }}-mix-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          fail-on-cache-miss: true

      # The formatter takes the DSL's paren-free calls from the dependencies in .formatter.exs's
      # import_deps, so it runs once they are fetched.
      - run: mix format --check-formatted
        env:
          MIX_ENV: test

  # mix_audit checks mix.lock against the elixir-security-advisories database. It runs a task from a
  # dependency, so it starts from the build like the format check. Hex's own audit is hex-audit.yml.
  audit:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
          hexpm-mirrors: ${{ env.HEXPM_MIRRORS }}

      - uses: actions/cache/restore@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-tool-versions-${{ hashFiles('.tool-versions') }}-mix-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          fail-on-cache-miss: true

      - run: mix deps.audit
        env:
          MIX_ENV: test

  # The provider is a module and its tests run without starting the CMS (`mix test` is aliased to
  # `test --no-start` in mix.exs), so there is no database to bring up.
  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict
          hexpm-mirrors: ${{ env.HEXPM_MIRRORS }}

      - uses: actions/cache/restore@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-tool-versions-${{ hashFiles('.tool-versions') }}-mix-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          fail-on-cache-miss: true

      # `mix test`, not `MIX_ENV=test mix test`, as in mishka_cms_core: a dependency may decide at
      # compile time what to start, and an exported MIX_ENV outranks the project's own override.
      # --warnings-as-errors also fails on warnings in the test files.
      - run: mix test --warnings-as-errors
